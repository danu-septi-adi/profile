      }

      .about-img img {
        width: 100%;
        display: block;
        transition: 0.5s;
      }
      .about-img:hover img {
        transform: scale(1.05);
      }

      /* SKILLS */
      .skills-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 30px;
      }

      .skill-info {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-weight: 500;
      }

      .progress {
        background: var(--bg-surface);
        border-radius: 20px;
        height: 12px;
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--primary), var(--secondary));
        transition: 1.5s cubic-bezier(1, 0, 0, 1);
      }

      /* --- FEATURED PROJECTS (MODERN GLASS) --- */
      .projects-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 40px;
      }

      .card {
        background: rgba(30, 41, 59, 0.7); /* Glass effect */
        backdrop-filter: blur(12px);
        border-radius: 24px;
        overflow: hidden;
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid rgba(255, 255, 255, 0.05);
        position: relative;
      }

      .card:hover {
        transform: translateY(-15px) scale(1.02);
        border-color: var(--primary);
        box-shadow:
          0 20px 40px rgba(0, 0, 0, 0.4),
          0 0 20px rgba(192, 132, 252, 0.25);
      }

      .card-img {
        position: relative;
        height: 220px;
        overflow: hidden;
        background: #000;
      }
      .card-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: 0.6s ease;
      }

      /* Overlay effect */
      .card-overlay {
        position: absolute;
        inset: 0;
        background: rgba(192, 132, 252, 0.35);
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: 0.4s;
        backdrop-filter: blur(4px);
      }
      .card-overlay i {
        color: white;
        font-size: 2rem;
        transform: translateY(20px);
        transition: 0.4s;
      }
      .card:hover .card-overlay {
        opacity: 1;
      }
      .card:hover .card-overlay i {
        transform: translateY(0);
      }
      .card:hover .card-img img {
        transform: scale(1.1);
      }

      .card-body {
        padding: 30px;
      }

      .card-tags {
        margin-bottom: 12px;
      }
      .card-tags span {
        font-size: 0.7rem;
        background: rgba(192, 132, 252, 0.12);
        color: var(--primary);
        padding: 5px 12px;
        border-radius: 50px;
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .card h3 {
        color: var(--text-light);
        margin-bottom: 12px;
        font-size: 1.4rem;
      }

      .card p {
        font-size: 0.95rem;
        opacity: 0.7;
        line-height: 1.6;
        margin-bottom: 25px;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .btn-project {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--primary);
        font-weight: 600;
        font-size: 0.9rem;
        transition: 0.3s;
      }
      .btn-project:hover {
        color: var(--secondary);
        transform: translateX(5px);
      }

      /* --- CONTACT FORM --- */
      .contact-wrapper {
        max-width: 700px;
        margin: auto;
        background: var(--bg-card);
        padding: 40px;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      input,
      textarea {
        padding: 18px;
        background: #120e1a;
        border: 1px solid #2d1f40;
        border-radius: 14px;
        color: white;
        outline: none;
        transition: 0.3s;
      }

      input:focus,
      textarea:focus {
        border-color: var(--primary);
        background: #1a1528;
        box-shadow: 0 0 15px rgba(192, 132, 252, 0.12);
      }

      textarea {
        height: 150px;
        resize: none;
      }

      /* UTILS */
      #topBtn {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: var(--primary);
        color: white;
        border: none;
        width: 55px;
        height: 55px;
        border-radius: 50%;
        display: none;
        cursor: pointer;
        z-index: 100;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        transition: 0.3s;
      }
      #topBtn:hover {
        transform: translateY(-5px);
        background: var(--secondary);
      }

      /* RESPONSIVE */
      @media (max-width: 768px) {
        .hero h1 {
          font-size: 2.5rem;
        }
        .section-title {
          font-size: 2rem;
        }
        .about-content {
          grid-template-columns: 1fr;
          text-align: center;
        }
        nav ul {
          display: none;
        }
        #water-ball {
          width: 45px;
          height: 45px;
        }
        .projects-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="water-ball"></div>
    <canvas id="bg-canvas"></canvas>
    <div id="bg-overlay"></div>

    <nav id="navbar">
      <div class="container">
        <div class="logo" id="nav-logo"></div>
        <ul id="nav-menu"></ul>
      </div>
    </nav>

    <section class="hero" id="home">
      <!-- Sakura petals container -->
      <div class="sakura-container" id="sakura-container"></div>
      <!-- Sparkle stars container -->
      <div id="sparkle-container"></div>
      <div class="hero-bg-img"></div>
      <div class="hero-overlay"></div>
      <div class="syntax-float-container" id="syntax-float-container"></div>
      <div class="syntax-float-container syntax-float-container--front" id="syntax-float-front"></div>
      <div class="container">
        <div data-aos="fade-up">
          <p
            id="hero-welcome"
            style="color: var(--primary); font-weight: 600; letter-spacing: 2px"
          ></p>
          <h1 id="hero-name"></h1>
          <div class="typing" style="min-height: 1.2em"></div>
          <p
            id="hero-desc"
            style="max-width: 600px; margin-top: 15px; opacity: 0.8"
          ></p>
          <a id="hero-btn" href="" class="btn"></a>
        </div>
      </div>
    </section>

    <section id="about">
      <div class="container">
        <h2 class="section-title" data-aos="fade-up">About Me</h2>
        <div class="about-content">
          <div class="about-img" data-aos="zoom-in">
            <img id="about-pfp" src="" alt="Danu Septi Adi — Informatics Engineer & Automation Specialist" loading="lazy" />
          </div>
          <div class="about-text" data-aos="fade-left">
            <div id="about-desc"></div>
            <div style="margin-top: 30px">
              <a
                id="cv-btn"
                href="#"
                target="_blank"
                class="btn"
                style="
                  background: transparent;
                  border: 2px solid var(--primary);
                "
                >Download CV</a
              >
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="skills">
      <div class="container">
        <h2 class="section-title" data-aos="fade-up">Technical Skills</h2>
        <div class="skills-grid" id="skills-container"></div>
      </div>
    </section>

    <section id="projects">
      <div class="container">
        <h2 class="section-title" data-aos="fade-up">Featured Projects</h2>
        <div class="projects-grid" id="projects-container"></div>
      </div>
    </section>

    <section id="contact">
      <div class="container" data-aos="fade-up">
        <h2 class="section-title">Let's Connect</h2>
        <div class="contact-wrapper">
          <form id="contactForm">
            <input
              type="text"
              id="contact-name"
              placeholder="Nama Lengkap"
              required
            />
            <input
              type="text"
              id="contact-company"
              placeholder="Nama Perusahaan / Instansi"
              required
            />
            <textarea
              id="contact-message"
              placeholder="Tuliskan pesan Anda di sini..."
              required
            ></textarea>
            <button class="btn" type="submit">
              Kirim via WhatsApp
              <i class="fab fa-whatsapp" style="margin-left: 8px"></i>
            </button>
          </form>
        </div>
      </div>
    </section>

    <button id="topBtn"><i class="fas fa-chevron-up"></i></button>

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script>
      const App = {
        whatsappNumber: "", // Will be filled from JSON

        async init() {
          try {
            const response = await fetch("./data/data.json");
            const data = await response.json();

            this.whatsappNumber = data.contact.whatsappNumber; // Save the WA number
            this.render(data);

            AOS.init({ duration: 1000, once: true });
            this.initTyping(data.hero.typingWords);
            this.initFloatingSyntax(data.syntax?.heroItems || []);
            this.initSectionSyntax(data.syntax?.sections || {});
            this.initSkillObserver();
            this.initScrollEffects();
            this.initWaterSystem();
            this.initContactForm(); // Initialize WA Redirect
          } catch (err) {
            console.error("Gagal load JSON:", err);
          }
        },

        render(data) {
          document.getElementById("nav-logo").innerHTML =
            `${data.navbar.logoFirst}<span>${data.navbar.logoLast}</span>`;
          document.getElementById("nav-menu").innerHTML = data.navbar.menu
            .map((m) => `<li><a href="${m.link}">${m.label}</a></li>`)
            .join("");

          document.getElementById("hero-welcome").innerText =
            data.hero.welcomeText;
          document.getElementById("hero-name").innerHTML = data.hero.name;
          document.getElementById("hero-desc").innerText =
            data.hero.description;
          const hBtn = document.getElementById("hero-btn");
          hBtn.innerText = data.hero.buttonText;
          hBtn.href = data.hero.buttonLink;

          document.getElementById("about-pfp").src = data.about.image;
          document.getElementById("about-desc").innerHTML =
            data.about.paragraphs
              .map((p) => `<p style="margin-bottom: 15px;">${p}</p>`)
              .join("");
          document.getElementById("cv-btn").href = data.about.cvLink;

          document.getElementById("skills-container").innerHTML = data.skills
            .map(
              (s) => `
                <div class="skill" data-aos="fade-up">
                    <div class="skill-info"><span>${s.name}</span><span>${s.percent}</span></div>
                    <div class="progress"><div class="progress-bar" data-width="${s.percent}"></div></div>
                </div>
            `,
            )
            .join("");

          document.getElementById("projects-container").innerHTML =
            data.projects
              .map(
                (p) => `
                            <div class="card" data-aos="fade-up">
                                <div class="card-img">
                                    <img src="${p.image}" alt="${p.title}" loading="lazy">
                                    <div class="card-overlay">
                                        <i class="fas fa-external-link-alt"></i>
                                    </div>
                                </div>
                                <div class="card-body">
                                    <div class="card-tags">
                                        <span><i class="fas fa-code"></i> Tech Solution</span>
                                    </div>
                                    <h3>${p.title}</h3>
                                    <p>${p.desc}</p>
                                    <a href="${p.link}" class="btn-project">
                                        Detail Project <i class="fas fa-chevron-right"></i>
                                    </a>
                                </div>
                            </div>
                        `,
              )
              .join("");
        },

        initContactForm() {
          const form = document.getElementById("contactForm");
          form.addEventListener("submit", (e) => {
            e.preventDefault(); // Stop form refreshing page

            const name = document.getElementById("contact-name").value;
            const company = document.getElementById("contact-company").value;
            const message = document.getElementById("contact-message").value;

            // Format the WhatsApp message
            const text = `Halo Danu, saya *${name}* dari *${company}*.\n\n${message}`;
            const encodedText = encodeURIComponent(text);

            // Redirect to wa.me
            const whatsappUrl = `https://wa.me/${this.whatsappNumber}?text=${encodedText}`;
            window.open(whatsappUrl, "_blank");
          });
        },

        initTyping(words) {
          let i = 0,
            j = 0,
            isDeleting = false;
          const el = document.querySelector(".typing");
          function type() {
            let current = words[i];
            el.textContent = isDeleting
              ? current.substring(0, j - 1)
              : current.substring(0, j + 1);
            j = isDeleting ? j - 1 : j + 1;
            if (!isDeleting && j === current.length) {
              isDeleting = true;
              setTimeout(type, 2000);
            } else if (isDeleting && j === 0) {
              isDeleting = false;
              i = (i + 1) % words.length;
              setTimeout(type, 500);
            } else {
              setTimeout(type, isDeleting ? 40 : 80);
            }
          }
          type();
        },

        initFloatingSyntax(items) {
          const layers = [
            document.getElementById("syntax-float-container"),
            document.getElementById("syntax-float-front"),
          ];
          const sourceItems = items || [];
          if (!sourceItems.length) return;

          const basePositions = [
            [8, 15], [16, 62], [28, 22], [72, 18], [78, 64], [52, 78],
          ];
          layers.forEach((layer, layerIndex) => {
            if (!layer) return;
            layer.innerHTML = sourceItems
              .map((item, idx) => {
                const [top, left] = basePositions[idx];
                const delay = (idx * 1.2 + layerIndex * 0.7).toFixed(1);
                const dur = (10 + idx * 1.3 + layerIndex).toFixed(1);
                return `<span class="syntax-float ${item.cls || ""} ${idx % 2 === 0 ? '' : 'syntax-float--dim'}" style="top:${top}%;left:${left}%;--dx:${12 + idx * 2}px;--dy:${-14 - idx * 2}px;--dur:${dur}s;animation-delay:-${delay}s"><i class="fas ${item.icon}"></i>${item.text}</span>`;
              })
              .join("");
          });
        },

        initSectionSyntax(sectionSyntax) {
          const sectionPlans = sectionSyntax || {};
          const cursorState = { x: 0, y: 0, active: false };
          const updateCursor = (e) => {
            const target = e.currentTarget || e.target;
            const rect = target.getBoundingClientRect();
            cursorState.x = (e.clientX - rect.left) / rect.width - 0.5;
            cursorState.y = (e.clientY - rect.top) / rect.height - 0.5;
            cursorState.active = true;
            target.querySelectorAll('.syntax-float').forEach((el) => {
              el.style.transform = `translate3d(${cursorState.x * 18}px, ${cursorState.y * 18}px, 0)`;
            });
          };
          const resetCursor = (e) => {
            const target = e.currentTarget || e.target;
            cursorState.active = false;
            target.querySelectorAll('.syntax-float').forEach((el) => {
              el.style.transform = '';
            });
          };

          const edgeLayouts = {
            about: [
              { top: 18, left: 2.5, cls: "syntax-float--left-edge syntax-float--small" },
              { top: 50, right: 2.5, cls: "syntax-float--right-edge syntax-float--tiny" },
              { top: 82, left: 2.5, cls: "syntax-float--left-edge syntax-float--small" },
            ],
            aboutFocus: true,
            skills: [
              { top: 12, right: 3, cls: "syntax-float--right-edge syntax-float--small" },
              { top: 50, left: 3, cls: "syntax-float--left-edge syntax-float--tiny" },
              { top: 82, right: 3, cls: "syntax-float--right-edge syntax-float--small" },
            ],
            projects: [
              { top: 15, left: 3, cls: "syntax-float--left-edge syntax-float--small" },
              { top: 48, right: 3, cls: "syntax-float--right-edge syntax-float--tiny" },
              { top: 80, left: 3, cls: "syntax-float--left-edge syntax-float--small" },
            ],
            contact: [
              { top: 14, right: 3, cls: "syntax-float--right-edge syntax-float--small" },
              { top: 54, left: 3, cls: "syntax-float--left-edge syntax-float--tiny" },
              { top: 78, right: 3, cls: "syntax-float--right-edge syntax-float--small" },
            ],
          };
          document.querySelectorAll("#about, #skills, #projects, #contact").forEach((section, sectionIndex) => {
            if (!section.querySelector(".syntax-float-container--section")) {
              const layer = document.createElement("div");
              layer.className = `syntax-float-container syntax-float-container--section syntax-float-container--interactive ${section.id === "about" ? "syntax-about-boost" : ""}`;
              if (section.id === "about") layer.classList.add("syntax-about-focus");
              section.prepend(layer);
              const items = sectionPlans[section.id] || [];
              const layout = edgeLayouts[section.id] || [];
              layer.innerHTML = items
                .map((item, idx) => {
                  const pos = layout[idx] || {};
                  const dur = (12 + sectionIndex + idx).toFixed(1);
                  const styleBits = [
                    pos.top != null ? `top:${pos.top}%` : "",
                    pos.left != null ? `left:${pos.left}%` : "",
                    pos.right != null ? `right:${pos.right}%` : "",
                    `--dx:${10 + idx * 3}px`,
                    `--dy:${-12 - idx * 2}px`,
                    `--dur:${dur}s`,
                    `animation-delay:-${(idx * 0.9).toFixed(1)}s`,
                  ].filter(Boolean).join(";");
                  return `<span class="syntax-float syntax-float--alt ${pos.cls || ""} ${section.id === "about" ? "syntax-float--bright" : ""}" style="${styleBits}"><i class="fas ${item.icon}"></i>${item.text}</span>`;
                })
                .join("");
              layer.addEventListener("mousemove", updateCursor);
              layer.addEventListener("mouseleave", resetCursor);
            }
          });
        },

        initSkillObserver() {
          const obs = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  entry.target
                    .querySelectorAll(".progress-bar")
                    .forEach((bar) => (bar.style.width = bar.dataset.width));
                }
              });
            },
            { threshold: 0.1 },
          );
          obs.observe(document.getElementById("skills"));
        },

        initScrollEffects() {
          const nav = document.getElementById("navbar");
          const topBtn = document.getElementById("topBtn");
          window.addEventListener("scroll", () => {
            window.scrollY > 50
              ? nav.classList.add("scrolled")
              : nav.classList.remove("scrolled");
            topBtn.style.display = window.scrollY > 600 ? "block" : "none";
          });
          topBtn.onclick = () =>
            window.scrollTo({ top: 0, behavior: "smooth" });
        },

        initWaterSystem() {
          const ball = document.getElementById("water-ball");
          let mX = 0,
            mY = 0,
            bX = 0,
            bY = 0;
          const moveHandler = (e) => {
            ball.style.display = "block";
            const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            mX = clientX;
            mY = clientY;
          };
          window.addEventListener("mousemove", moveHandler);
          window.addEventListener("touchmove", moveHandler);
          function lerp() {
            bX += (mX - bX) * 0.15;
            bY += (mY - bY) * 0.15;
            ball.style.transform = `translate(${bX - 15}px, ${bY - 15}px)`;
            requestAnimationFrame(lerp);
          }
          lerp();
          const createSplash = (e) => {
            const x = e.clientX || (e.touches ? e.touches[0].clientX : mX);
            const y = e.clientY || (e.touches ? e.touches[0].clientY : mY);
            const ring = document.createElement("div");
            ring.className = "splash";
            ring.style.left = x + "px";
            ring.style.top = y + "px";
            document.body.appendChild(ring);
            setTimeout(() => ring.remove(), 600);
            for (let i = 0; i < 6; i++) {
              const d = document.createElement("div");
              d.className = "drop";
              d.style.left = x + "px";
              d.style.top = y + "px";
              d.style.setProperty("--dx", (Math.random() - 0.5) * 120 + "px");
              d.style.setProperty("--dy", (Math.random() - 0.5) * 120 + "px");
              document.body.appendChild(d);
              setTimeout(() => d.remove(), 600);
            }
          };
          window.addEventListener("mousedown", createSplash);
          window.addEventListener("touchstart", (e) => {
            moveHandler(e);
            createSplash(e);
          });
        },
      };
      App.init();

      // --- 3D ANIME BACKGROUND ---
      (function init3DBackground() {
        const canvas = document.getElementById("bg-canvas");
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // === FLOATING CRYSTAL / GEMSTONE ===
        function createCrystal() {
          const geo = new THREE.OctahedronGeometry(0.5, 0);
          const mat = new THREE.MeshPhysicalMaterial({
            color: 0xc084fc,
            emissive: 0x8b5cf6,
            emissiveIntensity: 0.25,
            metalness: 0.3,
            roughness: 0.1,
            transparent: true,
            opacity: 0.7,
            wireframe: false,
          });
          const mesh = new THREE.Mesh(geo, mat);
          return mesh;
        }

        const crystals = [];
        const crystalCount = 30;
        for (let i = 0; i < crystalCount; i++) {
          const c = createCrystal();
          c.position.set(
            (Math.random() - 0.5) * 20,
            (Math.random() - 0.5) * 20,
            (Math.random() - 0.5) * 15 - 5
          );
          c.scale.setScalar(0.5 + Math.random() * 1.5);
          c.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
          c.userData = {
            rotSpeed: { x: (Math.random() - 0.5) * 0.01, y: (Math.random() - 0.5) * 0.01 },
            floatSpeed: 0.3 + Math.random() * 0.5,
            floatAmp: 0.1 + Math.random() * 0.3,
            phase: Math.random() * Math.PI * 2,
          };
          scene.add(c);
          crystals.push(c);
        }

        // === FLOATING PARTICLES (STARS) ===
        const particleCount = 420;
        const particlesGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const pSizes = new Float32Array(particleCount);
        for (let i = 0; i < particleCount; i++) {
          positions[i*3] = (Math.random() - 0.5) * 30;
          positions[i*3+1] = (Math.random() - 0.5) * 30;
          positions[i*3+2] = (Math.random() - 0.5) * 25 - 5;
          const tint = Math.random();
          if (tint < 0.33) {
            colors[i*3] = 0.66; colors[i*3+1] = 0.33; colors[i*3+2] = 0.97; // purple
          } else if (tint < 0.66) {
            colors[i*3] = 0.76; colors[i*3+1] = 0.27; colors[i*3+2] = 0.97; // magenta
          } else {
            colors[i*3] = 1; colors[i*3+1] = 1; colors[i*3+2] = 1; // white
          }
          pSizes[i] = 0.02 + Math.random() * 0.06;
        }
        particlesGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        particlesGeo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
        particlesGeo.setAttribute("size", new THREE.BufferAttribute(pSizes, 1));

        const particleMat = new THREE.PointsMaterial({
          size: 0.08,
          vertexColors: true,
          transparent: true,
          opacity: 0.8,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          sizeAttenuation: true,
        });
        const particleSystem = new THREE.Points(particlesGeo, particleMat);
        scene.add(particleSystem);

        // === WISPY NEBULA / ENERGY RINGS ===
        function createRing() {
          const ringGeo = new THREE.TorusGeometry(1.5, 0.03, 16, 64);
          const ringMat = new THREE.MeshBasicMaterial({
            color: new THREE.Color().setHSL(0.72 + Math.random() * 0.08, 0.7, 0.5),
            transparent: true,
            opacity: 0.15 + Math.random() * 0.15,
            blending: THREE.AdditiveBlending,
          });
          const ring = new THREE.Mesh(ringGeo, ringMat);
          ring.position.set(
            (Math.random() - 0.5) * 14,
            (Math.random() - 0.5) * 14,
            (Math.random() - 0.5) * 14 - 4
          );
          ring.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
          ring.scale.setScalar(0.5 + Math.random() * 1.2);
          ring.userData = {
            rotX: (Math.random() - 0.5) * 0.005,
            rotY: (Math.random() - 0.5) * 0.005,
          };
          return ring;
        }

        const rings = [];
        for (let i = 0; i < 8; i++) {
          const r = createRing();
          scene.add(r);
          rings.push(r);
        }

        // === CONNECTING LINES (constellation effect) ===
        const lineGeo = new THREE.BufferGeometry();
        const linePositions = [];
        const lineColors = [];
        const lineCount = 36;
        for (let i = 0; i < lineCount; i++) {
          const x = (Math.random() - 0.5) * 18;
          const y = (Math.random() - 0.5) * 18;
          const z = (Math.random() - 0.5) * 14 - 5;
          linePositions.push(x, y, z);
          const t = Math.random();
          lineColors.push(
            t < 0.5 ? 0.66 : 0.76,
            t < 0.5 ? 0.33 : 0.27,
            t < 0.5 ? 0.97 : 0.97
          );
        }
        lineGeo.setAttribute("position", new THREE.Float32BufferAttribute(linePositions, 3));
        lineGeo.setAttribute("color", new THREE.Float32BufferAttribute(lineColors, 3));

        const lineMat = new THREE.LineBasicMaterial({
          vertexColors: true,
          transparent: true,
          opacity: 0.15,
          blending: THREE.AdditiveBlending,
        });
        const lines = new THREE.LineSegments(lineGeo, lineMat);
        scene.add(lines);

        // Extra glow blobs
        const glowGeo = new THREE.SphereGeometry(0.4, 12, 12);
        const glowMat = new THREE.MeshBasicMaterial({
          color: 0xc084fc,
          transparent: true,
          opacity: 0.08,
        });
        const glows = [];
        for (let i = 0; i < 5; i++) {
          const g = new THREE.Mesh(glowGeo, glowMat.clone());
          g.material.color.setHSL(0.72 + Math.random() * 0.12, 0.6, 0.4);
          g.scale.setScalar(1 + Math.random() * 3);
          g.position.set(
            (Math.random() - 0.5) * 12,
            (Math.random() - 0.5) * 12,
            (Math.random() - 0.5) * 10 - 3
          );
          scene.add(g);
          glows.push(g);
        }

        camera.position.z = 8;
        let mouseX = 0, mouseY = 0;
        document.addEventListener("mousemove", (e) => {
          mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
          mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        const clock = new THREE.Clock();
        function animate() {
          requestAnimationFrame(animate);
          const t = clock.getElapsedTime();

          // slow orbit for camera
          camera.position.x += (mouseX * 2 - camera.position.x) * 0.005;
          camera.position.y += (-mouseY * 2 - camera.position.y) * 0.005;
          camera.lookAt(0, 0, 0);

          // rotate crystals
          crystals.forEach((c, i) => {
            c.rotation.x += c.userData.rotSpeed.x;
            c.rotation.y += c.userData.rotSpeed.y;
            c.position.y += Math.sin(t * c.userData.floatSpeed + c.userData.phase) * 0.001;
            c.position.x += Math.cos(t * c.userData.floatSpeed * 0.7 + c.userData.phase) * 0.001;
          });

          // rotate rings
          rings.forEach((r) => {
            r.rotation.x += r.userData.rotX;
            r.rotation.y += r.userData.rotY;
            r.rotation.z += 0.001;
          });

          // rotate lines
          lines.rotation.y += 0.0005;
          lines.rotation.x += 0.0003;

          // pulse glows
          glows.forEach((g, i) => {
            const s = 1 + Math.sin(t * 0.3 + i) * 0.3;
            g.scale.setScalar(s * (1 + i * 0.5));
            g.material.opacity = 0.05 + Math.sin(t * 0.5 + i * 1.5) * 0.03;
          });

          // rotate particles
          particleSystem.rotation.y += 0.0003;

          renderer.render(scene, camera);
        }

        animate();

        // handle resize
        window.addEventListener("resize", () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // === ANIME SAKURA PETALS ===
        (function createPetals() {
          const container = document.getElementById("sakura-container");
          if (!container) return;
          for (let i = 0; i < 25; i++) {
            const petal = document.createElement("div");
            petal.className = "petal";
            const size = 8 + Math.random() * 12;
            petal.style.width = size + "px";
            petal.style.height = size + "px";
            petal.style.left = Math.random() * 100 + "%";
            petal.style.animationDuration = (8 + Math.random() * 12) + "s";
            petal.style.animationDelay = Math.random() * 15 + "s";
            petal.style.opacity = 0.3 + Math.random() * 0.4;
            container.appendChild(petal);
          }
        })();

        // === ANIME SPARKLE STARS ===
        (function createSparkles() {
          const container = document.getElementById("sparkle-container");
          if (!container) return;
          for (let i = 0; i < 20; i++) {
            const star = document.createElement("div");
            star.className = "sparkle";
            star.style.left = Math.random() * 100 + "%";
            star.style.top = Math.random() * 100 + "%";
            star.style.animationDelay = Math.random() * 3 + "s";
            star.style.animationDuration = (1.5 + Math.random() * 2) + "s";
            container.appendChild(star);
          }
        })();
      })();
    </script>
  </body>
</html>
